services:
  mysql:
    image: mysql:8.4
    container_name: campuscircle-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${CAMPUSCIRCLE_DB_PASSWORD:-campuscircle_dev_pwd}
      MYSQL_DATABASE: campuscircle
      TZ: Asia/Shanghai
    ports:
      - "${CAMPUSCIRCLE_BIND_ADDRESS:-127.0.0.1}:${CAMPUSCIRCLE_MYSQL_PORT:-3307}:3306"
    volumes:
      - campuscircle-mysql-data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: campuscircle-redis
    restart: unless-stopped
    ports:
      - "${CAMPUSCIRCLE_BIND_ADDRESS:-127.0.0.1}:${CAMPUSCIRCLE_REDIS_PORT:-6379}:6379"
    volumes:
      - campuscircle-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    profiles:
      - search
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.8
    container_name: campuscircle-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${CAMPUSCIRCLE_BIND_ADDRESS:-127.0.0.1}:${CAMPUSCIRCLE_ES_PORT:-9200}:9200"
    volumes:
      - campuscircle-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow\\&timeout=1s >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  app:
    profiles:
      - app
    build:
      context: .
    container_name: campuscircle-app
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: redis
      CAMPUSCIRCLE_DB_URL: jdbc:mysql://mysql:3306/campuscircle?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      CAMPUSCIRCLE_DB_USERNAME: root
      CAMPUSCIRCLE_DB_PASSWORD: ${CAMPUSCIRCLE_DB_PASSWORD:-campuscircle_dev_pwd}
      CAMPUSCIRCLE_REDIS_HOST: redis
      CAMPUSCIRCLE_REDIS_PORT: 6379
      CAMPUSCIRCLE_REDIS_PASSWORD: ""
      CAMPUSCIRCLE_REDIS_DATABASE: 0
      CAMPUSCIRCLE_AUTH_REFRESH_COOKIE_SECURE: ${CAMPUSCIRCLE_AUTH_REFRESH_COOKIE_SECURE:-false}
      CAMPUSCIRCLE_AVATAR_STORAGE_DIR: /app/data/uploads/avatars
      CAMPUSCIRCLE_AI_PROVIDER: ${CAMPUSCIRCLE_AI_PROVIDER:-mock}
      CAMPUSCIRCLE_AI_BASE_URL: ${CAMPUSCIRCLE_AI_BASE_URL:-}
      CAMPUSCIRCLE_AI_API_KEY: ${CAMPUSCIRCLE_AI_API_KEY:-}
      CAMPUSCIRCLE_AI_MODEL: ${CAMPUSCIRCLE_AI_MODEL:-}
      CAMPUSCIRCLE_AI_TIMEOUT_SECONDS: ${CAMPUSCIRCLE_AI_TIMEOUT_SECONDS:-20}
      CAMPUSCIRCLE_AI_MAX_RETRIES: ${CAMPUSCIRCLE_AI_MAX_RETRIES:-1}
      CAMPUSCIRCLE_AI_MAX_REQUESTS_PER_MINUTE: ${CAMPUSCIRCLE_AI_MAX_REQUESTS_PER_MINUTE:-5}
      CAMPUSCIRCLE_AI_MAX_OUTPUT_TOKENS: ${CAMPUSCIRCLE_AI_MAX_OUTPUT_TOKENS:-600}
      CAMPUSCIRCLE_AI_STRUCTURED_OUTPUT: ${CAMPUSCIRCLE_AI_STRUCTURED_OUTPUT:-false}
      CAMPUSCIRCLE_AI_ENABLE_THINKING: ${CAMPUSCIRCLE_AI_ENABLE_THINKING:-}
      CAMPUSCIRCLE_SEARCH_ENABLED: ${CAMPUSCIRCLE_SEARCH_ENABLED:-false}
      CAMPUSCIRCLE_SEARCH_BASE_URL: http://elasticsearch:9200
      CAMPUSCIRCLE_SEARCH_POST_INDEX: ${CAMPUSCIRCLE_SEARCH_POST_INDEX:-campuscircle-posts}
      CAMPUSCIRCLE_SEARCH_REQUEST_TIMEOUT_SECONDS: ${CAMPUSCIRCLE_SEARCH_REQUEST_TIMEOUT_SECONDS:-5}
      CAMPUSCIRCLE_SEARCH_EMBEDDING_DIMENSIONS: ${CAMPUSCIRCLE_SEARCH_EMBEDDING_DIMENSIONS:-1024}
      CAMPUSCIRCLE_SEARCH_EMBEDDING_PROVIDER: ${CAMPUSCIRCLE_SEARCH_EMBEDDING_PROVIDER:-mock}
      CAMPUSCIRCLE_SEARCH_EMBEDDING_BASE_URL: ${CAMPUSCIRCLE_SEARCH_EMBEDDING_BASE_URL:-}
      CAMPUSCIRCLE_SEARCH_EMBEDDING_API_KEY: ${CAMPUSCIRCLE_SEARCH_EMBEDDING_API_KEY:-}
      CAMPUSCIRCLE_SEARCH_EMBEDDING_MODEL: ${CAMPUSCIRCLE_SEARCH_EMBEDDING_MODEL:-}
      CAMPUSCIRCLE_SEARCH_EMBEDDING_TIMEOUT_SECONDS: ${CAMPUSCIRCLE_SEARCH_EMBEDDING_TIMEOUT_SECONDS:-20}
      CAMPUSCIRCLE_SEARCH_CANDIDATE_LIMIT: ${CAMPUSCIRCLE_SEARCH_CANDIDATE_LIMIT:-20}
      CAMPUSCIRCLE_SEARCH_RRF_RANK_CONSTANT: ${CAMPUSCIRCLE_SEARCH_RRF_RANK_CONSTANT:-60}
    ports:
      - "${CAMPUSCIRCLE_BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
        required: false
    volumes:
      - campuscircle-upload-data:/app/data/uploads

  web:
    profiles:
      - app
    build:
      context: ./frontend
    container_name: campuscircle-web
    restart: unless-stopped
    ports:
      - "${CAMPUSCIRCLE_BIND_ADDRESS:-127.0.0.1}:${CAMPUSCIRCLE_WEB_PORT:-8088}:80"
    depends_on:
      app:
        condition: service_started

volumes:
  campuscircle-mysql-data:
  campuscircle-redis-data:
  campuscircle-elasticsearch-data:
  campuscircle-upload-data:
