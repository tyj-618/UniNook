spring:
  application:
    name: UniNook

  datasource:
    url: ${CAMPUSCIRCLE_DB_URL:jdbc:mysql://localhost:3306/campuscircle?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${CAMPUSCIRCLE_DB_USERNAME:root}
    password: ${CAMPUSCIRCLE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${CAMPUSCIRCLE_REDIS_HOST:localhost}
      port: ${CAMPUSCIRCLE_REDIS_PORT:6379}
      password: ${CAMPUSCIRCLE_REDIS_PASSWORD:}
      database: ${CAMPUSCIRCLE_REDIS_DATABASE:0}

  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force-response: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

campuscircle:
  auth:
    refresh-cookie-secure: ${CAMPUSCIRCLE_AUTH_REFRESH_COOKIE_SECURE:false}
  storage:
    avatar-directory: ${CAMPUSCIRCLE_AVATAR_STORAGE_DIR:./data/uploads/avatars}
  view-count:
    flush-interval-seconds: ${CAMPUSCIRCLE_VIEW_COUNT_FLUSH_INTERVAL_SECONDS:10}
  hot-post-cache:
    ttl-seconds: ${CAMPUSCIRCLE_HOT_POST_CACHE_TTL_SECONDS:300}
    jitter-seconds: ${CAMPUSCIRCLE_HOT_POST_CACHE_JITTER_SECONDS:60}
    empty-ttl-seconds: ${CAMPUSCIRCLE_HOT_POST_EMPTY_CACHE_TTL_SECONDS:30}
    rebuild-lock-ttl-seconds: ${CAMPUSCIRCLE_HOT_POST_REBUILD_LOCK_TTL_SECONDS:10}
  nearby-school-cache:
    ttl-seconds: ${CAMPUSCIRCLE_NEARBY_SCHOOL_CACHE_TTL_SECONDS:300}
    jitter-seconds: ${CAMPUSCIRCLE_NEARBY_SCHOOL_CACHE_JITTER_SECONDS:60}
  ai:
    provider: ${CAMPUSCIRCLE_AI_PROVIDER:mock}
    base-url: ${CAMPUSCIRCLE_AI_BASE_URL:}
    api-key: ${CAMPUSCIRCLE_AI_API_KEY:}
    model: ${CAMPUSCIRCLE_AI_MODEL:}
    timeout-seconds: ${CAMPUSCIRCLE_AI_TIMEOUT_SECONDS:20}
    max-retries: ${CAMPUSCIRCLE_AI_MAX_RETRIES:1}
    max-requests-per-minute: ${CAMPUSCIRCLE_AI_MAX_REQUESTS_PER_MINUTE:5}
    max-output-tokens: ${CAMPUSCIRCLE_AI_MAX_OUTPUT_TOKENS:600}
    chat-session-ttl-seconds: ${CAMPUSCIRCLE_AI_CHAT_SESSION_TTL_SECONDS:1800}
    chat-session-max-messages: ${CAMPUSCIRCLE_AI_CHAT_SESSION_MAX_MESSAGES:12}
    structured-output: ${CAMPUSCIRCLE_AI_STRUCTURED_OUTPUT:false}
    enable-thinking: ${CAMPUSCIRCLE_AI_ENABLE_THINKING:}
  search:
    enabled: ${CAMPUSCIRCLE_SEARCH_ENABLED:false}
    base-url: ${CAMPUSCIRCLE_SEARCH_BASE_URL:http://localhost:9200}
    post-index: ${CAMPUSCIRCLE_SEARCH_POST_INDEX:campuscircle-posts}
    request-timeout-seconds: ${CAMPUSCIRCLE_SEARCH_REQUEST_TIMEOUT_SECONDS:5}
    embedding-dimensions: ${CAMPUSCIRCLE_SEARCH_EMBEDDING_DIMENSIONS:1024}
    embedding-provider: ${CAMPUSCIRCLE_SEARCH_EMBEDDING_PROVIDER:mock}
    embedding-base-url: ${CAMPUSCIRCLE_SEARCH_EMBEDDING_BASE_URL:}
    embedding-api-key: ${CAMPUSCIRCLE_SEARCH_EMBEDDING_API_KEY:}
    embedding-model: ${CAMPUSCIRCLE_SEARCH_EMBEDDING_MODEL:}
    embedding-timeout-seconds: ${CAMPUSCIRCLE_SEARCH_EMBEDDING_TIMEOUT_SECONDS:20}
    candidate-limit: ${CAMPUSCIRCLE_SEARCH_CANDIDATE_LIMIT:20}
    rrf-rank-constant: ${CAMPUSCIRCLE_SEARCH_RRF_RANK_CONSTANT:60}
